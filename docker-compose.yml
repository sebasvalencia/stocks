services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acciones
      POSTGRES_PASSWORD: acciones
      POSTGRES_DB: acciones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acciones -d acciones"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://acciones:acciones@db:5432/acciones
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - web_nm:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_nm:
